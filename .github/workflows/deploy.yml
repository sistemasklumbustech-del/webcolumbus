name: Deploy frontend

# Push a main -> despliegue automático al VPS. workflow_dispatch permite
# also re-disparar el mismo deploy a mano desde la pestaña Actions de
# GitHub sin necesitar un commit nuevo (util si el deploy anterior
# fallo por una razon transitoria, ej. el VPS estaba reiniciando).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Compuerta antes de tocar el servidor (12-oct-2026): si el código no pasa la revisión de
  # tipos o hay una vulnerabilidad crítica en lo que corre en producción, no se despliega.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Vulnerabilidades críticas en dependencias de producción
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/webcolumbus
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            sudo systemctl restart columbus-web.service
            sleep 2
            systemctl is-active columbus-web.service
